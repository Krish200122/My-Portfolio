name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - "Krish/UIChanges"

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting --project "${{secrets.FIREBASE_PROJECT_ID}}" --token "${{ secrets.FIREBASE_TOKEN }}" --non-interactive
