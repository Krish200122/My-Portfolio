# ═══════════════════════════════════════════════════════════════
#  GitHub Actions — Auto Deploy to Firebase Hosting
#  Triggers on every push to main branch
# ═══════════════════════════════════════════════════════════════
name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - Krish/UIChanges         # deploy on every push to main
  
jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

    

      # 3. Deploy to Firebase Hosting
      - name: Deploy to Firebase Hosting (Live)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          channelId: live          # deploy to live channel

      # 4. Preview deploy on Pull Requests
      - name: Deploy Preview (PR)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          # no channelId = auto preview channel per PR
